# Builds Karpenter with the KWOK provider (SRS INF-1.2, ADR 0006) via infra/karpenter-kwok/build.sh and pushes it
# to GHCR. Runs on push to main when the build script or this workflow changes, or manually via workflow_dispatch.
name: karpenter-kwok

on:
  push:
    branches: [main]
    paths:
      - infra/karpenter-kwok/build.sh
      - .github/workflows/karpenter-kwok.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install ko
        run: go install github.com/google/ko@v0.18.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push karpenter-kwok
        env:
          REGISTRY: ghcr.io/${{ github.repository }}/karpenter-kwok
        run: infra/karpenter-kwok/build.sh

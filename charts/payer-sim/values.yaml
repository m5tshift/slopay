# payer-sim on weigate-lib (charts/weigate-lib/README.md). The stand values (image tag, secret reference) are set
# in weigate-gitops.
image:
  repository: zot.example.internal/weigate/payer-sim
  # CI sets the short commit SHA in weigate-gitops; this placeholder only lets the chart render.
  tag: dev
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

# The signed transactions and the nonces are kept in memory, so there is one replica.
replicaCount: 1
pdb:
  enabled: false

secrets:
  # Private keys of the pre-funded Anvil accounts, one hex key per line: /var/run/secrets/weigate/payer-keys/keys.
  # The Secret comes from the stand secret in OpenBao (ExternalSecret in weigate-gitops); keys are not in this repository.
  - name: payer-keys

env:
  INVOICE_SERVICE_URL: http://invoice-service.apps.svc:8080
  # Anvil on the stand (SRS 4.1.3).
  ANVIL_RPC_URL: http://anvil.chain.svc:8545
  PAYER_KEYS_FILE: /var/run/secrets/weigate/payer-keys/keys
  # Shares of invoices: paid in full, underpaid, not paid (SRS 8.1); they sum to 100.
  PAY_PERCENT: "80"
  UNDERPAY_PERCENT: "10"
  SKIP_PERCENT: "10"
  # An underpaying payer sends this part of the amount, in basis points (50 % is below any tolerance, at most 5 %, SRS 4.1.3).
  UNDERPAY_BPS: "5000"
  LOG_LEVEL: info

# ledger-service on weigate-lib (charts/weigate-lib/README.md). The stand values (image tag, addresses,
# ExternalSecret references) are set in weigate-gitops.
image:
  repository: zot.example.internal/weigate/ledger-service
  # CI sets the short commit SHA in weigate-gitops; this placeholder only lets the chart render.
  tag: dev
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

kafka:
  enabled: true
  brokers:
    - weigate-kafka-bootstrap.kafka.svc:9092

secrets:
  # Password of the service's PostgreSQL user: /var/run/secrets/weigate/postgres/password.
  - name: postgres

postgres:
  enabled: true
  url: postgres://ledger-service@ledger-pg-rw.data.svc:5432/ledger
  password:
    secret: postgres
    key: password

# Calls reconciliation-service -> ledger-service (SRS 4.1.9): 2 s timeout, one retry, outlier detection.
# Off by default: the minimal stand has no Istio CRDs; weigate-gitops enables them.
istio:
  destinationRule:
    enabled: false
  virtualService:
    enabled: false
    timeout: 2s
    retries:
      attempts: 1
      perTryTimeout: 2s

env:
  KAFKA_CONSUMER_GROUP: ledger-service
  # SRS 4.1.3: platform fee 0.5 % of every receipt, in basis points.
  FEE_BPS: "50"
  LOG_LEVEL: info

# invoice-service on weigate-lib (charts/weigate-lib/README.md). The stand values (image tag, addresses,
# ExternalSecret references) are set in weigate-gitops.
image:
  repository: zot.example.internal/weigate/invoice-service
  # CI sets the short commit SHA in weigate-gitops; this placeholder only lets the chart render.
  tag: dev
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

kafka:
  enabled: true
  brokers:
    - weigate-kafka-bootstrap.kafka.svc:9092

secrets:
  # Password of the service's PostgreSQL user: /var/run/secrets/weigate/postgres/password.
  - name: postgres
  # Password of the service's Valkey user: /var/run/secrets/weigate/valkey/password.
  - name: valkey

postgres:
  enabled: true
  url: postgres://invoice-service@invoice-pg-rw.data.svc:5432/invoice
  password:
    secret: postgres
    key: password

# Status cache of the payment page (SRS 4.1.7). Not part of readiness: on a miss PostgreSQL answers.
valkey:
  enabled: true
  addrs:
    - valkey.data.svc:6379
  username: invoice-service
  password:
    secret: valkey
    key: password

env:
  KAFKA_CONSUMER_GROUP: invoice-service
  # Timeouts and retries of this call are in the VirtualService of rate-service (SRS 4.1.9, ADR 0003);
  # the client timeout only bounds a call without a sidecar.
  RATE_SERVICE_URL: http://rate-service.apps.svc:8080
  RATE_SERVICE_TIMEOUT: 1s
  # SRS 4.1.3: a rate older than 60 s is not used; Retry-After of a 503 without one from rate-service.
  RATE_MAX_AGE: 60s
  RATE_RETRY_AFTER: 5s
  # SRS 4.1.4: invoice lifetime 15 min.
  INVOICE_TTL: 15m
  # SRS 4.1.7: status cache TTL 30 s.
  STATUS_CACHE_TTL: 30s
  VALKEY_TIMEOUT: 100ms
  # iss of the merchant-service JWT (SRS 4.1.10).
  JWT_ISSUER: weigate-merchant-service
  # The service verifies the JWT signature itself against this JWKS (also behind the Istio gateway).
  # The set is cached; an unknown kid reloads it at most once per JWKS_MIN_INTERVAL.
  JWKS_URL: http://merchant-service.apps.svc:8080/.well-known/jwks.json
  JWKS_TIMEOUT: 2s
  JWKS_REFRESH: 5m
  JWKS_MIN_INTERVAL: 10s
  LOG_LEVEL: info

# merchant-service on slopay-lib (charts/slopay-lib/README.md). The stand values (image tag, addresses,
# ExternalSecret references) are set in slopay-gitops.
image:
  repository: zot.example.internal/slopay/merchant-service
  # CI sets the short commit SHA in slopay-gitops; this placeholder only lets the chart render.
  tag: dev
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

kafka:
  enabled: true
  brokers:
    - slopay-kafka-bootstrap.kafka.svc:9092

secrets:
  # Password of the service's PostgreSQL user: /var/run/secrets/slopay/postgres/password.
  - name: postgres
  # ECDSA P-256 private key in PEM (PKCS#8 or SEC1) that signs the JWTs:
  # /var/run/secrets/slopay/jwt-signing/private.pem. The service re-reads the file after rotation.
  - name: jwt-signing

postgres:
  enabled: true
  url: postgres://merchant-service@merchant-pg-rw.data.svc:5432/merchant
  password:
    secret: postgres
    key: password

env:
  JWT_SIGNING_KEY_FILE: /var/run/secrets/slopay/jwt-signing/private.pem
  JWT_ISSUER: slopay-merchant-service
  # SRS 4.1.10: JWT lifetime, rotation grace period, at most two active API keys.
  JWT_TTL: 15m
  JWKS_MAX_AGE: 5m
  API_KEY_ROTATION_GRACE: 24h
  API_KEY_MAX_ACTIVE: "2"
  # SRS 4.1.4: payment tolerance 0..5 %, 1 % by default (basis points).
  TOLERANCE_DEFAULT_BPS: "100"
  TOLERANCE_MAX_BPS: "500"
  LOG_LEVEL: info

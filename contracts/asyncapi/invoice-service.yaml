asyncapi: 3.0.0
id: urn:slopay:invoice-service
info:
  title: invoice-service events
  version: 1.0.0
  description: |
    Invoice lifecycle events (SRS 4.1.4, 4.1.5). Published from the transactional outbox.

    Every event is a CloudEvents 1.0 envelope in structured JSON mode (`../schemas/cloudevent.v1.json`);
    the Kafka key equals the CloudEvent `subject`. Every invoice event carries `sequence`, the invoice
    version. Delivery is at-least-once: consumers deduplicate by the event `id`, transfers by
    `blockHash + txHash + logIndex`.

    Amounts are decimal strings of integers in minimal units of the asset (wei, token base units).
    `dataschema` is the `$id` of the versioned schema `<event>.v<N>.json`. A non-breaking change
    (a new optional field, a relaxed constraint) edits the current version; a breaking change adds
    `<event>.v<N+1>.json` and producers switch `dataschema` to it.
defaultContentType: application/cloudevents+json

channels:
  invoiceEvents:
    address: invoice.events
    title: invoice.events
    description: Invoice lifecycle. Key `invoiceId`, so the events of one invoice are ordered.
    x-producer: invoice-service
    x-consumers: [chain-watcher, webhook-service, ledger-service, reconciliation-service, clickhouse]
    bindings:
      kafka:
        partitions: 6
        replicas: 3
        bindingVersion: 0.5.0
    messages:
      created:
        $ref: '#/components/messages/created'
      detected:
        $ref: '#/components/messages/detected'
      confirming:
        $ref: '#/components/messages/confirming'
      paid:
        $ref: '#/components/messages/paid'
      underpaid:
        $ref: '#/components/messages/underpaid'
      expired:
        $ref: '#/components/messages/expired'
      latePaid:
        $ref: '#/components/messages/latePaid'
      reverted:
        $ref: '#/components/messages/reverted'
      lateTransfer:
        $ref: '#/components/messages/lateTransfer'
  chainBlocks:
    $ref: './chain-watcher.yaml#/channels/chainBlocks'
  chainTransfers:
    $ref: './chain-watcher.yaml#/channels/chainTransfers'
  merchantEvents:
    $ref: './merchant-service.yaml#/channels/merchantEvents'

operations:
  publishInvoiceEvents:
    action: send
    summary: Publish invoice transitions from the outbox.
    channel:
      $ref: '#/channels/invoiceEvents'
  consumeChainBlocks:
    action: receive
    summary: Maintain the canonical chain and chain time, count confirmations, handle reorgs.
    channel:
      $ref: '#/channels/chainBlocks'
  consumeChainTransfers:
    action: receive
    summary: Apply transfers whose block is in the canonical chain.
    channel:
      $ref: '#/channels/chainTransfers'
  consumeMerchantEvents:
    action: receive
    summary: Keep the projection of merchant xpubs and tolerances.
    channel:
      $ref: '#/channels/merchantEvents'

components:
  messageTraits:
    invoiceEvent:
      contentType: application/cloudevents+json
      headers:
        $ref: '../schemas/defs.v1.json#/definitions/kafkaHeaders'
      bindings:
        kafka:
          key:
            type: string
            description: invoiceId, equals the CloudEvent subject.
            format: uuid
          bindingVersion: 0.5.0

  messages:
    created:
      name: invoice.created
      title: Invoice created
      traits:
        - $ref: '#/components/messageTraits/invoiceEvent'
      payload:
        $ref: '../schemas/invoice.created.v1.json'
      examples:
        - name: eth
          headers:
            content-type: application/cloudevents+json; charset=UTF-8
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          payload:
            specversion: '1.0'
            id: 9f3b2c1d-8e7a-4b6c-9d5e-1f2a3b4c5d01
            source: /slopay/invoice-service
            type: invoice.created
            time: '2026-11-15T10:00:00Z'
            subject: 5d7c1a52-3b1e-4f0a-9a43-2f6f0c9b8e11
            dataschema: https://raw.githubusercontent.com/m5tshift/slopay/main/contracts/schemas/invoice.created.v1.json
            datacontenttype: application/json
            data:
              invoiceId: 5d7c1a52-3b1e-4f0a-9a43-2f6f0c9b8e11
              merchantId: 0b9f4e2a-7c3d-4e5f-8a1b-6c2d3e4f5a6b
              sequence: 1
              status: NEW
              address: '0x8ba1f109551bd432803012645ac136ddd64dba72'
              asset: {kind: ETH, decimals: 18}
              amount: '10000000000000000'
              orderId: order-1001
              amountUsdCents: 2500
              rate: '2500.00'
              expiresAt: '2026-11-15T10:15:00Z'
        - name: erc20
          headers:
            content-type: application/cloudevents+json; charset=UTF-8
          payload:
            specversion: '1.0'
            id: 9f3b2c1d-8e7a-4b6c-9d5e-1f2a3b4c5d02
            source: /slopay/invoice-service

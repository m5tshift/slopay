asyncapi: 3.0.0
id: urn:weigate:merchant-service
info:
  title: merchant-service events
  version: 1.0.0
  description: |
    Merchant state for the local projections of other services (SRS 4.1.2, 4.1.3, 4.1.5, 4.1.10).
    Published from the transactional outbox.

    Envelope, key and versioning rules are the same as in `invoice-service.yaml`. `merchant.events`
    is compacted by `merchantId`: every event carries the whole state of the merchant, the last one
    wins. A consumer ignores an event whose `version` is lower than the one it holds.

    The webhook signing secret is never published: the event carries only its version, and
    webhook-service reads the secret from OpenBao.
defaultContentType: application/cloudevents+json

channels:
  merchantEvents:
    address: merchant.events
    title: merchant.events
    description: State of merchants. Key `merchantId`, compacted.
    x-producer: merchant-service
    x-consumers: [invoice-service, webhook-service]
    bindings:
      kafka:
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy: [compact]
        bindingVersion: 0.5.0
    messages:
      updated:
        $ref: '#/components/messages/updated'

operations:
  publishMerchantEvents:
    action: send
    summary: Publish the merchant state from the outbox.
    channel:
      $ref: '#/channels/merchantEvents'

components:
  messageTraits:
    merchantEvent:
      contentType: application/cloudevents+json
      headers:
        $ref: '../schemas/defs.v1.json#/definitions/kafkaHeaders'
      bindings:
        kafka:
          key:
            type: string
            description: merchantId, equals the CloudEvent subject.
            format: uuid
          bindingVersion: 0.5.0

  messages:
    updated:
      name: merchant.updated
      title: Merchant updated
      traits:
        - $ref: '#/components/messageTraits/merchantEvent'
      payload:
        $ref: '../schemas/merchant.updated.v1.json'
      examples:
        - name: registered
          headers:
            content-type: application/cloudevents+json; charset=UTF-8
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          payload:
            specversion: '1.0'
            id: 6c1e2f3a-4b5d-4c6e-8f70-91a2b3c4d5e6
            source: /weigate/merchant-service
            type: merchant.updated
            time: '2026-11-15T09:00:00Z'
            subject: 0b9f4e2a-7c3d-4e5f-8a1b-6c2d3e4f5a6b
            dataschema: https://raw.githubusercontent.com/m5tshift/weigate/main/contracts/schemas/merchant.updated.v1.json
            datacontenttype: application/json
            data:
              merchantId: 0b9f4e2a-7c3d-4e5f-8a1b-6c2d3e4f5a6b
              version: 1
              xpub: xpub661MyMwAqRbcFtXgS5sYJABqqG9YLmC4Q1Rdap9gSE8NqtwybGhePY2gZ29ESFjqJoCu1Rupje8YtGqsefD265TMg7usUDFdp6W1EGMcet8
              webhookUrl: null
              toleranceBps: 100
              webhookSecretVersion: 1
        - name: webhook-secret-rotated
          headers:
            content-type: application/cloudevents+json; charset=UTF-8
          payload:
            specversion: '1.0'
            id: 7d2f3a4b-5c6e-4d7f-9a81-a2b3c4d5e6f7
            source: /weigate/merchant-service
            type: merchant.updated
            time: '2026-11-15T12:30:00Z'
            subject: 0b9f4e2a-7c3d-4e5f-8a1b-6c2d3e4f5a6b
            dataschema: https://raw.githubusercontent.com/m5tshift/weigate/main/contracts/schemas/merchant.updated.v1.json
            datacontenttype: application/json
            data:
              merchantId: 0b9f4e2a-7c3d-4e5f-8a1b-6c2d3e4f5a6b
              version: 3
              xpub: xpub661MyMwAqRbcFtXgS5sYJABqqG9YLmC4Q1Rdap9gSE8NqtwybGhePY2gZ29ESFjqJoCu1Rupje8YtGqsefD265TMg7usUDFdp6W1EGMcet8
              webhookUrl: https://merchant.example.com/hooks/weigate

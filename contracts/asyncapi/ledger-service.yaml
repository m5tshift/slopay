asyncapi: 3.0.0
id: urn:weigate:ledger-service
info:
  title: ledger-service events
  version: 1.0.0
  description: |
    Double-entry postings (SRS 4.1.3, 4.1.5). Published from the transactional outbox.

    Envelope, key and versioning rules are the same as in `invoice-service.yaml`. The postings are
    idempotent by `blockHash + txHash + logIndex`: the event `id` repeats the key, so a repeated
    posting has the same `id`. There are no reversing postings. Reconciliation does not read this
    topic: it checks the ledger through the statement API.
defaultContentType: application/cloudevents+json

channels:
  ledgerEvents:
    address: ledger.events
    title: ledger.events
    description: Receipt and fee postings. Key `merchantId`.
    x-producer: ledger-service
    x-consumers: []
    bindings:
      kafka:
        partitions: 3
        replicas: 3
        bindingVersion: 0.5.0
    messages:
      receiptPosted:
        $ref: '#/components/messages/receiptPosted'
      feeAccrued:
        $ref: '#/components/messages/feeAccrued'
  invoiceEvents:
    $ref: './invoice-service.yaml#/channels/invoiceEvents'

operations:
  publishLedgerEvents:
    action: send
    summary: Publish postings from the outbox.
    channel:
      $ref: '#/channels/ledgerEvents'
  consumeInvoiceEvents:
    action: receive
    summary: Post a receipt and the fee for every transfer that reached N confirmations.
    channel:
      $ref: '#/channels/invoiceEvents'

components:
  messageTraits:
    ledgerEvent:
      contentType: application/cloudevents+json
      headers:
        $ref: '../schemas/defs.v1.json#/definitions/kafkaHeaders'
      bindings:
        kafka:
          key:
            type: string
            description: merchantId, equals the CloudEvent subject.
            format: uuid
          bindingVersion: 0.5.0

  messages:
    receiptPosted:
      name: ledger.receipt_posted
      title: Receipt posted
      traits:
        - $ref: '#/components/messageTraits/ledgerEvent'
      payload:
        $ref: '../schemas/ledger.receipt_posted.v1.json'
      examples:
        - name: eth
          headers:
            content-type: application/cloudevents+json; charset=UTF-8
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          payload:
            specversion: '1.0'
            id: 'receipt:0xa1b2c3d4a1b2c3d4a1b2c3d4a1b2c3d4a1b2c3d4a1b2c3d4a1b2c3d4a1b2c3d4:0xd4e5f6a7d4e5f6a7d4e5f6a7d4e5f6a7d4e5f6a7d4e5f6a7d4e5f6a7d4e5f6a7:'

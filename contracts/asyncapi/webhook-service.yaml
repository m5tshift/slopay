                subject: 5d7c1a52-3b1e-4f0a-9a43-2f6f0c9b8e11
                dataschema: https://raw.githubusercontent.com/m5tshift/slopay/main/contracts/schemas/invoice.created.v1.json
                datacontenttype: application/json
                data:
                  invoiceId: 5d7c1a52-3b1e-4f0a-9a43-2f6f0c9b8e11
                  merchantId: 0b9f4e2a-7c3d-4e5f-8a1b-6c2d3e4f5a6b
                  sequence: 1
                  status: NEW
                  address: '0x8ba1f109551bd432803012645ac136ddd64dba72'
                  asset: {kind: ETH, decimals: 18}
                  amount: '10000000000000000'
                  orderId: order-1001
                  amountUsdCents: 2500
                  rate: '2500.00'
                  expiresAt: '2026-11-15T10:15:00Z'

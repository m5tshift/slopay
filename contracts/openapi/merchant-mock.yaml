openapi: 3.0.3
info:
  title: merchant-mock API
  version: 1.0.0
  description: |
    Test component that plays a merchant endpoint for `webhook-service` (SRS 4.1.3, 4.1.10, 8.2б). It accepts the
    webhooks of `contracts/openapi/webhook.yaml`, verifies them like a real merchant must and keeps a journal.
    One instance serves many endpoints: the endpoint name is the last segment of the webhook URL, so the URL of
    a virtual merchant in its settings is `http://merchant-mock.apps.svc.cluster.local/webhook/<endpoint>`.

    **Verification** (`POST /webhook/{endpoint}`): the secret is chosen by `X-SLOPay-Secret-Version`; the current
    version and the previous one are accepted, the previous one for 24 h after the rotation. The timestamp must
    be within 5 minutes of the clock of the component, the signature is `v1=` + hex HMAC-SHA256 of
    `<timestamp>.<raw body>` and is compared in constant time. A valid webhook is acknowledged with `200` even if
    it is a duplicate (the same event `id`) or stale (`data.sequence` lower than already accepted for the invoice):
    such a webhook is only counted and journaled, so the sender stops retrying.

    **Commands** (`/control/*`) set the secrets of an endpoint, make it answer `500` or answer with a delay, read
    the journal and return everything to the initial state. The component lives in the cluster mesh only; like the
    other internal APIs it has no application-level authentication. The state is kept in memory.

    **Metrics** (`/metrics`): `merchant_mock_webhooks_total{endpoint,outcome}`, where `outcome` is one of
    `accepted`, `duplicate`, `stale`, `invalid_signature`, `invalid_timestamp`, `unknown_secret_version`,
    `malformed`, `injected_error`.
servers:
  - url: http://merchant-mock.apps.svc.cluster.local
    description: In-cluster service

tags:
  - name: webhook
  - name: control

paths:
  /webhook/{endpoint}:
    post:
      tags: [webhook]
      operationId: receiveWebhook
      summary: Receive an invoice webhook
      description: |
        Order of checks: injected delay, injected error, headers, secret version, timestamp, signature, body,
        duplicate, order. `404` for an endpoint that no command has created.
      parameters:
        - $ref: '#/components/parameters/Endpoint'
        - name: X-SLOPay-Timestamp
          in: header
          required: true
          schema:
            type: string
        - name: X-SLOPay-Signature
          in: header
          required: true
          schema:
            type: string
        - name: X-SLOPay-Secret-Version
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The invoice event of `webhook.yaml`.
      responses:
        '200':
          description: Accepted, or a duplicate or stale webhook that is acknowledged and ignored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResult'
              example:
                outcome: accepted
        '400':
          description: Headers or body are malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: malformed
                message: Body is not an invoice event
        '401':
          description: Unknown secret version, timestamp out of tolerance or wrong signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: invalid_signature
                message: Signature does not match
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          description: Injected failure of the endpoint (`500` by default).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: injected_error
                message: Failure injected by a command

  /control/endpoints/{endpoint}:
    get:
      tags: [control]
      operationId: getEndpoint
      summary: State and counters of an endpoint
      parameters:
        - $ref: '#/components/parameters/Endpoint'
      responses:
        '200':
          $ref: '#/components/responses/Endpoint'
        '404':
          $ref: '#/components/responses/NotFound'

  /control/endpoints/{endpoint}/secret:
    put:
      tags: [control]
      operationId: setSecret
      summary: Set the secret of an endpoint
      description: |
        Creates the endpoint if needed. A version above the current one becomes current and the former current
        becomes the previous one (accepted for the configured period from now, 24 h by default), as after
        `POST /api/v1/merchants/me/webhook-secret/rotate`. The same version replaces the secret, a lower one
        is rejected. The secret is used as bytes, as issued, and is never returned or logged.
      parameters:
        - $ref: '#/components/parameters/Endpoint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Secret'
            example:
              version: 2
              secret: whsec_example
      responses:
        '200':
          $ref: '#/components/responses/Endpoint'
        '400':
          $ref: '#/components/responses/InvalidRequest'

  /control/endpoints/{endpoint}/fault:
    put:
      tags: [control]
      operationId: setFault
      summary: Make an endpoint fail or answer slowly
      description: |
        Creates the endpoint if needed. A webhook waits `delayMs` first, then, if `status` is set, is answered
        with it without verification. `delayMs` longer than the timeout of the sender makes it a failed attempt.
        `{}` removes the fault.
      parameters:
        - $ref: '#/components/parameters/Endpoint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fault'
            example:
              status: 500
              delayMs: 0
      responses:
        '200':
          $ref: '#/components/responses/Endpoint'
        '400':
          $ref: '#/components/responses/InvalidRequest'

  /control/endpoints/{endpoint}/journal:
    get:
      tags: [control]
      operationId: getJournal
      summary: Journal of the webhooks of an endpoint
      description: The latest entries, oldest first; the journal keeps a configured number of entries.
      parameters:
        - $ref: '#/components/parameters/Endpoint'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
      responses:
        '200':
          description: The entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journal'
              example:
                entries:
                  - receivedAt: '2026-11-28T12:00:05Z'
                    outcome: accepted
                    eventId: 6c3f1c1e-6a0b-4d44-9a8e-3a8f4f0f5b22
                    invoiceId: 0d6f1c1e-6a0b-4d44-9a8e-3a8f4f0f5b21
                    sequence: 4
                    type: invoice.paid
                    secretVersion: 2
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /control/reset:
    post:
      tags: [control]
      operationId: resetControl
      summary: Forget all endpoints
      description: Removes secrets, faults, journals and counters of every endpoint.
      responses:
        '204':
          description: Done.

components:
  parameters:
    Endpoint:
      name: endpoint
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
  responses:
    Endpoint:
      description: The endpoint after the command.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Endpoint'
          example:
            name: merchant-1
            secretVersion: 2
            previousSecretVersion: 1
            fault: {status: 500, delayMs: 0}
            counters:
              accepted: 12
              duplicate: 1
              stale: 0
              invalid_signature: 0
              invalid_timestamp: 0
              unknown_secret_version: 0
              malformed: 0
              injected_error: 3
    NotFound:
      description: No command has created the endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Unknown endpoint
    InvalidRequest:
      description: The request is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_request
            message: version must be a positive integer
  schemas:
    Outcome:
      type: string
      enum:
        - accepted
        - duplicate
        - stale
        - invalid_signature
        - invalid_timestamp
        - unknown_secret_version
        - malformed
        - injected_error
    WebhookResult:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [accepted, duplicate, stale]
    Secret:
      type: object
      required: [version, secret]
      properties:
        version:
          type: integer
          minimum: 1
        secret:
          type: string
          minLength: 1
    Fault:
      type: object
      properties:
        status:
          type: integer
          minimum: 500
          maximum: 599
          description: Status to answer with; absent - no error.
        delayMs:
          type: integer
          minimum: 0
          maximum: 60000
          description: Delay before the answer; absent - none.
    FaultState:
      type: object
      required: [delayMs]
      properties:
        status:
          type: integer
        delayMs:
          type: integer
    Endpoint:
      type: object
      required: [name, fault, counters]
      properties:
        name:
          type: string
        secretVersion:
          type: integer
          description: Absent until a secret is set.
        previousSecretVersion:
          type: integer
          description: Present while the previous version is still accepted.
        fault:
          $ref: '#/components/schemas/FaultState'
        counters:
          type: object
          required:
            - accepted
            - duplicate
            - stale
            - invalid_signature
            - invalid_timestamp
            - unknown_secret_version
            - malformed
            - injected_error
          additionalProperties:
            type: integer
            minimum: 0
    JournalEntry:
      type: object
      required: [receivedAt, outcome]
      properties:
        receivedAt:
          type: string
          format: date-time
        outcome:
          $ref: '#/components/schemas/Outcome'
        eventId:
          type: string
        invoiceId:
          type: string
        sequence:
          type: integer
        type:
          type: string
        secretVersion:
          type: integer
          description: Version from the header, when it is a number.
    Journal:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

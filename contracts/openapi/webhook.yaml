openapi: 3.0.3
info:
  title: SLOPay merchant webhook
  version: 1.0.0
  description: |
    The webhook that webhook-service sends to the merchant endpoint (SRS 4.1.3, 4.1.10; FR-07). The endpoint is
    implemented by the merchant; this document is the contract it must accept. The URL is set only in merchant
    settings (`PUT /api/v1/merchants/me/webhook` of merchant-service).

    **Delivery.** A webhook is sent on every invoice status transition. The body is the invoice event, the same
    CloudEvents envelope as in `invoice.events` (`../schemas/invoice.*.v1.json`). Any `2xx` is success; anything
    else, a timeout or no connection is a failed attempt and is retried after 1 min, 5 min and 30 min, then the
    delivery goes to the DLQ. Delivery is at-least-once: the same webhook can arrive again, and webhooks of one
    invoice can arrive out of order.

    **Idempotency and order.** Deduplicate by `id` of the event. Webhooks arrive out of order, so keep the highest
    `data.sequence` processed per `data.invoiceId` and ignore a webhook whose `sequence` is lower.

    **Signature.** HMAC-SHA256, computed anew for every attempt, so the timestamp and the signature of a repeated
    delivery differ while the body is the same.

    1. `timestamp` is the value of `X-SLOPay-Timestamp`: Unix time in whole seconds, decimal, no leading zeros.
    2. The string to sign is the bytes `timestamp` + `.` (one ASCII dot, 0x2E) + the raw request body exactly as
       received, without parsing or re-serialising. No other separators or newlines.
    3. `signature` = lower-case hex of `HMAC-SHA256(key = webhook secret, message = string to sign)`; 64 characters.
    4. The header is `X-SLOPay-Signature: v1=<signature>`.

    The key is the secret bytes as they were issued by merchant-service, without decoding. Verify in constant
    time. Reject the webhook if the timestamp differs from the receiver clock by more than 5 minutes (replay
    protection).

    **Secret rotation.** After `POST /api/v1/merchants/me/webhook-secret/rotate` webhooks are signed with the new
    secret at once, and `X-SLOPay-Secret-Version` carries its version. For 24 h the merchant accepts both the old
    and the new version: choose the secret by the version from the header.
servers:
  - url: '{webhookUrl}'
    description: The webhook URL from the merchant settings; webhooks are sent to it as is.
    variables:
      webhookUrl:
        default: https://merchant.example.com/slopay/webhook

tags:
  - name: webhook

paths:
  /:
    post:
      tags: [webhook]
      operationId: receiveInvoiceEvent
      summary: Invoice event
      description: |
        Implemented by the merchant. Answer `2xx` quickly (webhook-service waits for the answer a limited time) and
        process the event afterwards.
      parameters:
        - name: X-SLOPay-Timestamp
          in: header
          required: true
          description: Unix time in whole seconds of this attempt; part of the string to sign.
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]{0,15})$'
            example: '1795953600'
        - name: X-SLOPay-Signature
          in: header
          required: true
          description: '`v1=` and the lower-case hex HMAC-SHA256 of `<timestamp>.<raw body>`.'
          schema:
            type: string
            pattern: '^v1=[0-9a-f]{64}$'
            example: v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
        - name: X-SLOPay-Secret-Version
          in: header
          required: true
          description: Version of the secret the signature is made with (`webhookSecretVersion` of the merchant).
          schema:
            type: integer
            minimum: 1
            example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceWebhook'
            example:
              specversion: '1.0'
              id: 6c3f1c1e-6a0b-4d44-9a8e-3a8f4f0f5b22
              source: /slopay/invoice-service
              type: invoice.paid
              time: '2026-11-28T12:00:05Z'
              subject: 0d6f1c1e-6a0b-4d44-9a8e-3a8f4f0f5b21
              dataschema: https://raw.githubusercontent.com/m5tshift/slopay/main/contracts/schemas/invoice.paid.v1.json
              datacontenttype: application/json
              data:
                invoiceId: 0d6f1c1e-6a0b-4d44-9a8e-3a8f4f0f5b21
                sequence: 4
                status: PAID
      responses:
        '2XX':
          description: The webhook is accepted. The body is ignored.
        '4XX':
          description: Not accepted (for example the signature is wrong); the attempt is retried.
        '5XX':
          description: Failure on the merchant side; the attempt is retried.

components:
  schemas:
    InvoiceWebhook:
      type: object
      description: |
        CloudEvents envelope of an invoice event. `data` always has the fields below; the rest depends on `type` and
        is described by the schema named in `dataschema` (`../schemas/`).
      required: [specversion, id, source, type, time, subject, dataschema, datacontenttype, data]
      properties:
        specversion:
          type: string
          enum: ['1.0']
        id:
          type: string
          minLength: 1
          description: Event id. Deduplicate by it.
        source:
          type: string
          enum: [/slopay/invoice-service]
        type:
          type: string
          enum:
            - invoice.created
            - invoice.detected
            - invoice.confirming
            - invoice.paid
            - invoice.underpaid
            - invoice.expired
            - invoice.late_paid
            - invoice.reverted
            - invoice.late_transfer
        time:
          type: string
          format: date-time
        subject:
          type: string
          format: uuid
          description: Invoice id.
        dataschema:
          type: string
          format: uri
        datacontenttype:
          type: string
          enum: [application/json]
        data:
          type: object
          required: [invoiceId, sequence, status]
          properties:
            invoiceId:
              type: string
              format: uuid
            sequence:
              type: integer
              minimum: 1
              description: Invoice version; ignore a webhook with a number lower than already processed.
            status:
              type: string
              enum: [NEW, DETECTED, CONFIRMING, PAID, UNDERPAID, EXPIRED, LATE_PAID]
              description: Status of the invoice; in `invoice.late_transfer` it is the unchanged final status.
          additionalProperties: true

openapi: 3.0.3
info:
  title: reporting-service API
  version: 1.0.0
  description: |
    Reports to a merchant on turnover and conversion for a period (SRS 4.1.3, FR-11). The data is read from the
    ClickHouse views `merchant_turnover_daily` and `merchant_conversion_daily` (read-only); the views are filled
    from `invoice.events`, so a report lags the invoice by the Kafka-to-ClickHouse delay and counts an invoice
    on the day of its first event (conversion) or of its first `invoice.paid` / `invoice.late_paid` (turnover).
    Served through the Istio Ingress Gateway, HTTPS only, as part of the merchant API `/api/v1/*`.

    **Authentication.** A JWT (`Authorization: Bearer`) issued by merchant-service (see `merchant-service.yaml`);
    the gateway verifies it, the service verifies the signature again, the merchant id is the `sub` claim.
    A merchant sees only its own data.

    **Period.** `from` and `to` are dates in UTC, both inclusive. `from` must not be after `to`; the period is
    limited by `REPORT_MAX_DAYS` (default 92 days). Days without invoices are absent from the report.

    **Money.** USD is an integer number of cents.
servers:
  - url: https://weigate.example.com
    description: Stand gateway (the real host is set by the gateway route)

tags:
  - name: reports

security:
  - bearerAuth: []

paths:
  /api/v1/reports/turnover:
    get:
      tags: [reports]
      operationId: getTurnoverReport
      summary: Turnover by day
      description: Paid invoices and their total in USD cents per day of payment.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: The report, ordered by day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnoverReport'
              example:
                from: '2026-11-01'
                to: '2026-11-02'
                items:
                  - day: '2026-11-01'
                    paidInvoices: 12
                    turnoverUsdCents: 153000
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/reports/conversion:
    get:
      tags: [reports]
      operationId: getConversionReport
      summary: Conversion by day
      description: |
        Created and paid invoices per day of creation and the share of paid ones. An invoice paid later than
        the day of its creation counts for the day of creation.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: The report, ordered by day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionReport'
              example:
                from: '2026-11-01'
                to: '2026-11-02'
                items:
                  - day: '2026-11-01'
                    createdInvoices: 20
                    paidInvoices: 12
                    conversion: 0.6
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from `POST /api/v1/auth/token` of merchant-service, ES256, 15 minutes.

  parameters:
    From:
      name: from
      in: query
      required: true
      description: First day of the period (UTC, inclusive).
      schema:
        type: string
        format: date
        example: '2026-11-01'
    To:
      name: to
      in: query
      required: true
      description: Last day of the period (UTC, inclusive).
      schema:
        type: string
        format: date
        example: '2026-11-30'

  responses:
    ValidationError:
      description: A parameter is missing or invalid, `from` is after `to`, or the period is too long.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_failed
            message: Request validation failed
    Unauthorized:
      description: Missing, invalid or expired JWT.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: Invalid credentials
    Unavailable:
      description: ClickHouse is unavailable; repeat later.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unavailable
            message: Reports are temporarily unavailable

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    TurnoverReport:
      type: object
      required: [from, to, items]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/TurnoverDay'

    TurnoverDay:
      type: object
      required: [day, paidInvoices, turnoverUsdCents]
      properties:
        day:
          type: string
          format: date
        paidInvoices:
          type: integer
          format: int64
          minimum: 0
        turnoverUsdCents:
          type: integer
          format: int64
          minimum: 0
          description: Sum of the amounts of the paid invoices in USD cents.

    ConversionReport:
      type: object
      required: [from, to, items]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversionDay'

    ConversionDay:
      type: object
      required: [day, createdInvoices, paidInvoices, conversion]
      properties:
        day:
          type: string
          format: date
        createdInvoices:
          type: integer
          format: int64
          minimum: 0
        paidInvoices:
          type: integer
          format: int64
          minimum: 0
        conversion:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: '`paidInvoices / createdInvoices`; a ratio, not money.'

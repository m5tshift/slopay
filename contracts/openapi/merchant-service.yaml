openapi: 3.0.3
info:
  title: merchant-service API
  version: 1.0.0
  description: |
    Merchant registration, API keys, JWT issuing, xpub and webhook settings (SRS 4.1.2, 4.1.10, UC-06, UC-07;
    FR-13, FR-14). Served through the Istio Ingress Gateway under `/api/v1/*`, HTTPS only.

    **Authentication.** Every operation except `POST /api/v1/merchants` and `POST /api/v1/auth/token`
    requires a JWT (`Authorization: Bearer`). The gateway checks the signature against the JWKS
    (`RequestAuthentication`) and does not call the service per request. `POST /api/v1/auth/token` is the only
    operation that accepts an API key.

    **JWT.** Signed by OpenBao Transit: key `merchant-jwt`, ECDSA P-256, `ES256`. The private key never leaves
    OpenBao. The JWT lives 15 minutes; issued tokens are not revoked and expire on their own. The JWKS is built
    from the public versions of the Transit key; `kid` identifies the key version. The JWT carries the merchant
    id in `sub`.

    **Rate limits** (SRS 4.1.10). Token endpoint: 10 requests/min per API key and 30 requests/min per IP.
    Registration: 5 requests/min per IP. When a limit is exceeded the response is `429` with `Retry-After`.

    **Money-free API.** The tolerance is an integer in basis points (1 bp = 0.01 %), 0..500 (SRS 4.1.4: 0-5 %).
    The webhook URL is set only here and never in the invoice creation request (SRS 4.1.10).

    State changes are published to `merchant.events` from the transactional outbox (see
    `../asyncapi/merchant-service.yaml`). The webhook signing secret is never published.
servers:
  - url: https://slopay.example.com
    description: Stand gateway (the real host is set by the gateway route)

tags:
  - name: registration
  - name: auth
  - name: settings
  - name: api-keys
  - name: webhook-secret

security:
  - bearerAuth: []

paths:
  /api/v1/merchants:
    post:
      tags: [registration]
      operationId: registerMerchant
      summary: Register a merchant
      description: |
        Creates a merchant and its first API key. The API key is shown once in this response and is stored
        only as a hash. No JWT is needed. Limit: 5 requests/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMerchantRequest'
      responses:
        '201':
          description: Merchant registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterMerchantResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/token:
    post:
      tags: [auth]
      operationId: issueToken
      summary: Exchange an API key for a JWT
      description: |
        The only operation that accepts an API key. Returns a JWT valid for 15 minutes.
        Limits: 10 requests/min per API key, 30 requests/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /.well-known/jwks.json:
    get:
      tags: [auth]
      operationId: getJwks
      summary: JSON Web Key Set
      description: |
        Public keys for JWT verification, built from the public versions of the OpenBao Transit key
        `merchant-jwt`. Read by the gateway; it is not part of the external `/api/v1` API.
      security: []
      responses:
        '200':
          description: JWKS.
          headers:
            Cache-Control:
              description: Caching hint for the gateway.
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'

  /api/v1/merchants/me:
    get:
      tags: [settings]
      operationId: getMerchant
      summary: Current merchant settings
      responses:
        '200':
          description: Settings of the authenticated merchant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/merchants/me/xpub:
    put:
      tags: [settings]
      operationId: setXpub
      summary: Upload the xpub
      description: |
        Stores the extended public key. The format is checked: only a public key is accepted, a private key
        (`xprv`, `tprv`) is rejected with `400` and is never stored or logged. The response carries the first
        derived address (index 0 of the external chain) so the merchant can compare it with the wallet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XpubRequest'
      responses:
        '200':
          description: xpub stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XpubResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/merchants/me/webhook:
    put:
      tags: [settings]
      operationId: setWebhookSettings
      summary: Set the webhook URL and the tolerance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSettingsRequest'
      responses:
        '200':
          description: Settings stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/merchants/me/api-keys:
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: List API keys
      description: Keys that are active or scheduled for deactivation. The key value is never returned.
      responses:
        '200':
          description: API keys.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [api-keys]
      operationId: issueApiKey
      summary: Issue a new API key
      description: |
        Planned rotation. At most two keys are active at the same time. The previous key is deactivated
        24 hours after the new one is issued (`expiresAt`). The key value is shown once.
      responses:
        '201':
          description: Key issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Two keys are already active; revoke one first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/merchants/me/api-keys/{keyId}:
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: Revoke an API key immediately
      description: |
        Emergency revoke: the key stops working at once. JWTs already issued are not revoked and expire
        within 15 minutes. The last active key cannot be revoked.
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Key revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This is the last active key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/merchants/me/webhook-secret/rotate:
    post:
      tags: [webhook-secret]
      operationId: rotateWebhookSecret
      summary: Rotate the webhook signing secret
      description: |
        Webhooks are signed with the new secret immediately and carry its version in the header; the merchant
        accepts both versions for 24 hours (SRS 4.1.10). The new secret is shown once.
      responses:
        '200':
          description: Secret rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedWebhookSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from `POST /api/v1/auth/token`, ES256, 15 minutes.

  responses:
    ValidationError:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            code: validation_failed
            message: Request validation failed
            details:
              - field: toleranceBps
                message: must be between 0 and 500
    Unauthorized:
      description: Missing, invalid or expired credentials (wrong API key or JWT).
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: Invalid credentials
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before the next request.
          required: true
          schema:
            type: integer
            minimum: 1
            example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rate_limited
            message: Too many requests

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: unauthorized
        message:
          type: string
          description: Human-readable text. Never contains keys, tokens or secrets.
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string

    RegisterMerchantRequest:
      type: object
      required: [name, email]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Example Shop
        email:
          type: string
          format: email
          maxLength: 254
          example: owner@merchant.example.com
    RegisterMerchantResponse:
      type: object
      required: [merchantId, apiKey]
      properties:
        merchantId:
          type: string
          format: uuid
        apiKey:
          $ref: '#/components/schemas/IssuedApiKey'

    ApiKey:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, expiring]
          description: '`expiring` is an old key that is deactivated at `expiresAt`.'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
    IssuedApiKey:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The API key. Shown once, only its hash is stored.
              example: slp_live_EXAMPLE_NOT_A_REAL_KEY

    TokenRequest:
      type: object
      required: [apiKey]
      additionalProperties: false
      properties:
        apiKey:
          type: string
          minLength: 1
          maxLength: 256
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT, ES256.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          enum: [900]
          description: Lifetime in seconds (15 minutes).

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          description: One entry per public version of the Transit key `merchant-jwt`.
          items:
            $ref: '#/components/schemas/Jwk'
    Jwk:
      type: object
      required: [kty, crv, alg, use, kid, x, y]
      properties:
        kty:
          type: string
          enum: [EC]
        crv:
          type: string
          enum: [P-256]
        alg:
          type: string
          enum: [ES256]
        use:
          type: string
          enum: [sig]
        kid:
          type: string
          description: Key version.
        x:
          type: string
          description: base64url, 32 bytes.
        y:
          type: string
          description: base64url, 32 bytes.

    Merchant:
      type: object
      required: [merchantId, name, email, xpub, webhookUrl, toleranceBps, webhookSecretVersion]
      properties:
        merchantId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        xpub:
          type: string
          nullable: true
          description: Null until uploaded.
        webhookUrl:
          type: string
          format: uri
          nullable: true
          description: Null until set.
        toleranceBps:
          $ref: '#/components/schemas/ToleranceBps'
        webhookSecretVersion:
          type: integer
          minimum: 1

    ToleranceBps:
      type: integer
      minimum: 0
      maximum: 500
      default: 100
      description: Allowed shortfall in basis points, 0..500 (0-5 %); the default is 100 (1 %).

    XpubRequest:
      type: object
      required: [xpub]
      additionalProperties: false
      properties:
        xpub:
          type: string
          minLength: 100
          maxLength: 120
          pattern: '^[xt]pub[1-9A-HJ-NP-Za-km-z]{100,}$'
          description: BIP-32 extended public key, Base58Check; the checksum is verified by the service.
          example: xpub661MyMwAqRbcFtXgS5sYJABqqG9YLmC4Q1Rdap9gSE8NqtwybGhePY2gZ29ESFjqJoCu1Rupje8YtGqsefD265TMg7usUDFdp6W1EGMcet8
    XpubResponse:
      type: object
      required: [xpub, firstAddress]
      properties:
        xpub:
          type: string
        firstAddress:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
          description: First derived address, to compare with the merchant wallet.
          example: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F'

    WebhookSettingsRequest:
      type: object
      required: [webhookUrl]
      additionalProperties: false
      properties:
        webhookUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          example: https://merchant.example.com/hooks/slopay
        toleranceBps:
          $ref: '#/components/schemas/ToleranceBps'

    RotatedWebhookSecret:
      type: object
      required: [version, secret]
      properties:
        version:
          type: integer
          minimum: 2
        secret:
          type: string
          description: The new webhook signing secret. Shown once.
          example: whsec_EXAMPLE_NOT_A_REAL_SECRET

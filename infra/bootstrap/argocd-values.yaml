# Argo CD values for the minimal stand (SRS 6.4). Chart version is pinned in bootstrap.sh.
# Dex, notifications and ApplicationSet are not needed: root is a plain Application, access is port-forward.
global:
  domain: argocd.local

configs:
  params:
    server.insecure: true
  repositories:
    # Plain-HTTP OCI chart registry in Zot (SRS CI-5.3) used by full-stand Applications.
    zot-charts:
      type: helm
      name: zot-charts
      url: zot.registry.svc:5000/weigate/charts
      enableOCI: "true"
      insecureOCIForceHttp: "true"
  cm:
    # Without this, sync-wave between child Applications of the App of Apps does not wait for their health (issue #108).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: false

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}

redis:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}

redisSecretInit:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}
